<div class="gaip-news-bridge-backdrop" role="presentation" data-news-close-modal>

<div class="gaip-news-bridge-modal-scroll">
<header class="pageHeader___SFDaB gaip-news-bridge-modal-head">
<button class="gaip-news-bridge-close" type="button" aria-label="关闭" data-news-close-modal>{{close}}</button>
<img class="pageTitle___nxEXS" src="shared/assets/icons/business/news-center/page-title.svg" alt="资讯中心">

</header>
<div class="articleCard___x4eww gaip-news-bridge-detail-card">

</div>

</button>
</div>
</div>
</div>

</dl>

</div>
